<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARP RECORDS · 個人收藏</title>
<meta name="description" content="ARP RECORDS 個人收藏清單，可搜尋藝人與專輯。">
<style>
  :root{
    --bg:#1a1616; --surface:#241f1f; --gold:#f2d98c; --teal:#6fb3b6;
    --text:#f4efe6; --muted:#a99f96; --line:#38302f; --brand:#c25a54;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; line-height:1.5;}
  header{padding:26px 18px 16px; border-bottom:1px solid var(--line);
    text-align:center; background:linear-gradient(180deg,#221c1c,var(--bg));}
  h1{font-size:24px; margin:0 0 4px; color:var(--gold); letter-spacing:1px;}
  .arplogo{display:block; margin:0 auto 10px; height:66px; max-width:76%; object-fit:contain;}
  @media(max-width:560px){ .arplogo{height:52px;} }
  .sub{color:var(--teal); font-size:14px; margin-bottom:6px;}
  .meta{color:var(--muted); font-size:13px;}
  .backlink{display:inline-block; margin-top:10px; color:var(--muted); font-size:13px; text-decoration:none;
    border:1px solid var(--line); border-radius:20px; padding:5px 14px;}
  .backlink:hover{color:var(--gold); border-color:var(--gold);}
  .toolbar{max-width:900px; margin:16px auto 0; padding:0 18px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  #csearch{flex:1; min-width:200px; padding:11px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:15px;}
  #csearch::placeholder{color:var(--muted);}
  #csearch:focus, #csort:focus{outline:none; border-color:var(--teal);}
  #csort{background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-size:14px;}
  .fb-btn{position:fixed; right:16px; bottom:16px; z-index:900; background:var(--brand); color:#fff;
    border:none; border-radius:22px; padding:10px 18px; font-size:13.5px; font-family:inherit;
    cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .fb-btn:hover{filter:brightness(1.1);}
  .fb-mask{position:fixed; inset:0; background:rgba(8,6,6,.72); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .fb-box{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px; width:100%; max-width:420px;}
  .fb-box h3{margin:0 0 4px; font-size:17px; color:var(--gold); font-weight:500;}
  .fb-box p.fb-sub{margin:0 0 12px; font-size:12.5px; color:var(--muted);}
  .fb-box label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px;}
  .fb-box select, .fb-box input, .fb-box textarea{width:100%; background:#14100f; color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit;}
  .fb-box textarea{min-height:96px; resize:vertical;}
  .fb-box select:focus, .fb-box input:focus, .fb-box textarea:focus{outline:none; border-color:var(--teal);}
  .fb-hp{position:absolute; left:-9999px; width:1px; height:1px;}
  .fb-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:14px;}
  .fb-actions button{border-radius:8px; padding:9px 16px; font-size:13.5px; font-family:inherit; cursor:pointer;}
  .fb-cancel{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .fb-send{background:var(--brand); border:1px solid var(--brand); color:#fff;}
  .fb-send:disabled{opacity:.55; cursor:default;}
  .fb-hint{margin-top:10px; font-size:12.5px; min-height:17px;}
  main{max-width:900px; margin:0 auto; padding:14px 18px 90px;}
  #cstatus{color:var(--muted); text-align:center; padding:30px 0;}
  table{width:100%; border-collapse:collapse; font-size:14.5px;}
  thead th{position:sticky; top:0; background:var(--bg); text-align:left; color:var(--muted);
    font-weight:600; font-size:12.5px; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody td{padding:9px 10px; border-bottom:1px solid #23252f; vertical-align:top;}
  tbody tr:hover{background:#241f1f88;}
  .cnum{color:var(--muted); font-variant-numeric:tabular-nums; width:64px; white-space:nowrap;}
  .cartist{color:var(--text);}
  .calbum{color:var(--gold);}
  .pager{display:flex; justify-content:center; align-items:center; gap:12px; margin-top:16px; color:var(--muted); font-size:13px; flex-wrap:wrap;}
  .pager button{background:transparent; border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13px;}
  .pager button:disabled{opacity:.4; cursor:default;}
  .pager button:not(:disabled):hover{border-color:var(--teal); color:var(--teal);}
  .empty{color:var(--muted); text-align:center; padding:30px 0;}
  @media(max-width:560px){ .cnum{width:48px;} thead th, tbody td{padding:8px 7px;} }
</style>
</head>

  <div class="sub">個人收藏 Collection</div>

</header>
<div class="toolbar">
  <input id="csearch" type="search" placeholder="搜尋藝人或專輯…" autocomplete="off">
  <select id="csort">
    <option value="num">預設順序</option>
    <option value="artist">藝人 A→Z</option>
    <option value="album">專輯 A→Z</option>
  </select>
</div>
<main>
  <div id="cstatus">載入收藏中…</div>
  <table id="ctable" style="display:none;">
    <thead><tr><th class="cnum">#</th><th>藝人</th><th>專輯</th></tr></thead>
    <tbody id="cbody"></tbody>
  </table>
  <div class="empty" id="cempty" style="display:none;">沒有符合的收藏</div>
  <div class="pager" id="cpager" style="display:none;">
    <button id="cprev">‹ 上一頁</button>
    <span id="cpageinfo"></span>
    <button id="cnext">下一頁 ›</button>
  </div>
</main>
  <button id="fbBtn" class="fb-btn" type="button" style="display:none;">意見回饋</button>
  <div id="fbMask" class="fb-mask" style="display:none;">
    <div class="fb-box" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
      <h3 id="fbTitle">意見回饋</h3>
      <p class="fb-sub">想找的專輯、網站問題、或任何想說的都歡迎！</p>
      <label for="fbKind">類型</label>
      <select id="fbKind">
        <option value="許願">許願（想找的專輯）</option>
        <option value="網站問題">網站問題</option>
        <option value="純粹意見">純粹意見</option>
      </select>
      <label for="fbMsg">留言 <span style="color:var(--brand);">*</span></label>
      <textarea id="fbMsg" maxlength="1000" placeholder="請告訴我你的想法…"></textarea>
      <label for="fbContact">聯絡方式（選填）</label>
      <input id="fbContact" maxlength="120" placeholder="Email / IG / 隨意，方便的話我可以回覆你">
      <input id="fbHp" class="fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="fb-actions">
        <button type="button" id="fbCancel" class="fb-cancel">取消</button>
        <button type="button" id="fbSend" class="fb-send">送出</button>
      </div>
      <div id="fbHint" class="fb-hint"></div>
    </div>
  </div>
<script>
  var DEFAULT_SHEET_ID = '1W7CVXLPnvjKi7QFsGfHdjIgqgMIdDOMuKx9v1_a7ekw';
  var PAGE_SIZE = 100;
  // 從 config.json（後台發布時寫入）決定要連動的試算表；格式不合就用預設。方便日後遷移。
  function resolveSheetId(config){
    var id = (config && typeof config.sheetId === 'string') ? config.sheetId.trim() : '';
    return /^[\w-]+$/.test(id) ? id : DEFAULT_SHEET_ID;
  }
  var COLLECTION = [], FILTERED = [], PAGE = 1;

  // 把 gviz JSON 回應轉成 { items:[{n,artist,album}], updatedAt }。
  // A 欄=專輯、B 欄=藝人；更新時間取 E 欄（index 4）第一個有值的格（即 E2）的顯示值。
  function parseCollection(resp){
    var out = { items: [], updatedAt: '' };
    if(!resp || !resp.table || !Array.isArray(resp.table.rows)) return out;
    var n = 0;
    resp.table.rows.forEach(function(r){
      var c = (r && r.c) ? r.c : [];
      // ⚠ 不要相信試算表的標題列：A 欄標「Album name」但實際放的是藝人，
      // B 欄標「Artist name」但實際放的是專輯。以實際內容為準，不是以標題為準。
      var artist = (c[0] && c[0].v != null) ? String(c[0].v).trim() : '';
      var album  = (c[1] && c[1].v != null) ? String(c[1].v).trim() : '';
      if(!out.updatedAt && c[4] && (c[4].f || c[4].v)){ out.updatedAt = String(c[4].f || c[4].v); }
      if(!album && !artist) return;              // 跳過空白列
      n++;
      out.items.push({ n: n, artist: artist, album: album });
    });
    return out;
  }

  function cmpStr(a, b){ return String(a||'').toLocaleLowerCase().localeCompare(String(b||'').toLocaleLowerCase(), 'zh-Hant'); }

  function setCollection(parsed){
    COLLECTION = (parsed && parsed.items) || [];
    var upd = document.getElementById('cupdated');
    upd.textContent = (parsed && parsed.updatedAt) ? ('收藏更新於 ' + parsed.updatedAt + '　') : '';
    document.getElementById('cstatus').style.display = 'none';
    document.getElementById('ctable').style.display = '';
    applyCollectionFilter();
  }

  function applyCollectionFilter(){
    var q = (document.getElementById('csearch').value || '').trim().toLowerCase();
    var sort = document.getElementById('csort').value;
    var list = COLLECTION.filter(function(it){
      return !q || ((it.artist + ' ' + it.album).toLowerCase().indexOf(q) !== -1);
    });
    if(sort === 'artist') list = list.slice().sort(function(a,b){ return cmpStr(a.artist,b.artist) || (a.n-b.n); });
    else if(sort === 'album') list = list.slice().sort(function(a,b){ return cmpStr(a.album,b.album) || (a.n-b.n); });
    FILTERED = list; PAGE = 1;
    document.getElementById('ccount').textContent = q
      ? ('符合 ' + list.length + ' ／ 共 ' + COLLECTION.length + ' 張')
      : ('共 ' + COLLECTION.length + ' 張');
    renderPage();
  }

  function totalPages(){ return Math.max(1, Math.ceil(FILTERED.length / PAGE_SIZE)); }
  function renderPage(){
    var tbody = document.getElementById('cbody'); tbody.innerHTML = '';
    var empty = document.getElementById('cempty'), pager = document.getElementById('cpager');
    if(FILTERED.length === 0){ empty.style.display = 'block'; pager.style.display = 'none'; document.getElementById('ctable').style.display='none'; return; }
    empty.style.display = 'none'; document.getElementById('ctable').style.display='';
    var start = (PAGE - 1) * PAGE_SIZE;
    FILTERED.slice(start, start + PAGE_SIZE).forEach(function(it){
      var tr = document.createElement('tr');
      var tdN = document.createElement('td'); tdN.className = 'cnum'; tdN.textContent = it.n; tr.appendChild(tdN);
      var tdA = document.createElement('td'); tdA.className = 'cartist'; tdA.textContent = it.artist || '—'; tr.appendChild(tdA);
      var tdB = document.createElement('td'); tdB.className = 'calbum'; tdB.textContent = it.album || '—'; tr.appendChild(tdB);
      tbody.appendChild(tr);
    });
    var tp = totalPages();
    pager.style.display = tp > 1 ? 'flex' : 'none';
    document.getElementById('cpageinfo').textContent = '第 ' + PAGE + ' / ' + tp + ' 頁';
    document.getElementById('cprev').disabled = PAGE <= 1;
    document.getElementById('cnext').disabled = PAGE >= tp;
  }
  function gotoPage(p){ var tp = totalPages(); PAGE = Math.min(Math.max(1, p), tp); renderPage(); window.scrollTo({top:0, behavior:'smooth'}); }

  document.getElementById('csearch').addEventListener('input', applyCollectionFilter);
  document.getElementById('csort').addEventListener('change', applyCollectionFilter);

  // ---- 搜尋追蹤（送到同一個 Apps Script，帶 page:'collection' → 寫另一個工作表）----
  // ---- 意見回饋（送到同一支 Apps Script，type:'feedback' → 寫 feedback 工作表）----
  function fbTrackUrl(){ return (typeof FB_TRACK === 'string' && FB_TRACK) ? FB_TRACK : ''; }
  function fbInit(){
    var btn = document.getElementById('fbBtn'); if(!btn) return;
    if(!fbTrackUrl()) return;                    // 沒設追蹤網址就不顯示按鈕
    btn.style.display = '';
    var mask = document.getElementById('fbMask');
    var hint = document.getElementById('fbHint');
    var open = function(){ mask.style.display = 'flex'; hint.textContent = ''; document.getElementById('fbMsg').focus(); };
    var close = function(){ mask.style.display = 'none'; };
    btn.addEventListener('click', open);
    document.getElementById('fbCancel').addEventListener('click', close);
    mask.addEventListener('click', function(e){ if(e.target === mask) close(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && mask.style.display !== 'none') close(); });
    document.getElementById('fbSend').addEventListener('click', function(){
      var send = this;
      var msg = (document.getElementById('fbMsg').value || '').trim();
      if(!msg){ hint.style.color = 'var(--brand)'; hint.textContent = '請先填寫留言'; return; }
      if((document.getElementById('fbHp').value || '').trim()){ close(); return; }   // 蜜罐：機器人填了就靜默丟棄
      var last = 0; try{ last = parseInt(localStorage.getItem('arp_fb_last') || '0', 10) || 0; }catch(e){}
      if(Date.now() - last < 60000){ hint.style.color = 'var(--brand)'; hint.textContent = '剛剛已送出過，請稍候再試'; return; }
      var body = JSON.stringify({
        type:'feedback', t:new Date().toISOString(),
        kind: document.getElementById('fbKind').value,
        message: msg,
        contact: (document.getElementById('fbContact').value || '').trim(),
        page: location.pathname, ua: navigator.userAgent || ''
      });
      try{
        if(navigator.sendBeacon){ navigator.sendBeacon(fbTrackUrl(), new Blob([body],{type:'text/plain'})); }
        else { fetch(fbTrackUrl(), {method:'POST', mode:'no-cors', keepalive:true, body:body}); }
      }catch(e){}
      try{ localStorage.setItem('arp_fb_last', String(Date.now())); }catch(e){}
      send.disabled = true;
      hint.style.color = 'var(--teal)'; hint.textContent = '已送出，謝謝你的回饋！';
      document.getElementById('fbMsg').value = ''; document.getElementById('fbContact').value = '';
      setTimeout(function(){ close(); send.disabled = false; }, 1400);
    });
  }
  var FB_TRACK = '';
  var COLL_TRACK = '', _lastCS = '', _csTimer = null, _csPending = '';
  function collIsOwner(){ try{ return localStorage.getItem('arp_owner') === '1'; }catch(e){ return false; } }
  function collSource(){
    var params = new URLSearchParams(location.search);
    var utm = params.get('utm_source') || params.get('from'); if(utm) return utm;
    var host = ''; try{ host = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./,'') : ''; }catch(e){}
    if(!host) return '直接進入';
    if(/facebook|fb\./.test(host)) return 'Facebook';
    if(/threads/.test(host)) return 'Threads';
    if(/instagram/.test(host)) return 'Instagram';
    if(/line\./.test(host)) return 'LINE';
    if(/google/.test(host)) return 'Google';
    if(/tinyurl/.test(host)) return 'TinyURL';
    return host;
  }
  function collBeacon(body){
    try{
      if(navigator.sendBeacon){ navigator.sendBeacon(COLL_TRACK, new Blob([body],{type:'text/plain'})); }
      else { fetch(COLL_TRACK, {method:'POST', mode:'no-cors', keepalive:true, body:body}); }
    }catch(e){}
  }
  // 造訪事件（讓收藏頁的儀表板也有造訪數/來源/裝置/每日）
  function sendCollPv(){
    if(!COLL_TRACK || collIsOwner()) return;
    collBeacon(JSON.stringify({ ev:'pv', page:'collection', t:new Date().toISOString(),
      src:collSource(), ref:document.referrer||'', path:location.pathname,
      scr:(screen.width+'x'+screen.height), lang:navigator.language||'', ua:navigator.userAgent||'' }));
  }
  function sendCollSearch(term){
    term = (term || '').trim();
    if(!COLL_TRACK || collIsOwner() || !term || term === _lastCS) return;
    _lastCS = term;
    collBeacon(JSON.stringify({ ev:'search', page:'collection', t:new Date().toISOString(), q:term,
      src:collSource(), scr:(screen.width+'x'+screen.height), lang:navigator.language||'',
      ua:navigator.userAgent||'', ref:document.referrer||'' }));
  }
  function trackCollSearch(term){                 // 打字中：等停 3.5 秒才記，避免記前綴
    _csPending = (term || '').trim();
    if(!COLL_TRACK || collIsOwner()) return;
    clearTimeout(_csTimer);
    if(!_csPending) return;
    _csTimer = setTimeout(function(){ sendCollSearch(_csPending); }, 3500);
  }
  function commitCollSearch(){ clearTimeout(_csTimer); sendCollSearch(_csPending); }
  document.getElementById('csearch').addEventListener('input', function(){ trackCollSearch(this.value); });
  document.getElementById('csearch').addEventListener('keydown', function(e){ if(e.key === 'Enter') commitCollSearch(); });
  document.getElementById('csearch').addEventListener('blur', commitCollSearch);
  window.addEventListener('pagehide', commitCollSearch);
  document.getElementById('cprev').addEventListener('click', function(){ gotoPage(PAGE-1); });
  document.getElementById('cnext').addEventListener('click', function(){ gotoPage(PAGE+1); });

  function loadFromSheet(sheetId){
    var status = document.getElementById('cstatus');
    window.__collCb = function(resp){
      try{ setCollection(parseCollection(resp)); }
      catch(e){ status.textContent = '資料解析失敗，請稍後再試。'; }
    };
    var s = document.createElement('script');
    s.src = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json;responseHandler:__collCb&headers=1';
    s.onerror = function(){ status.textContent = '無法載入收藏資料，請稍後再試。'; };
    document.body.appendChild(s);
  }
  function initCollection(){
    // 先讀同源 config.json（後台發布時寫入）決定試算表；讀不到就用預設 ID
    fetch('./config.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
      .then(function(cfg){
        COLL_TRACK = (cfg && typeof cfg.trackUrl === 'string') ? cfg.trackUrl : '';
        FB_TRACK = COLL_TRACK; fbInit();
        // ?iam=owner → 把這台裝置設為店主，之後造訪不計入統計（與商店頁共用同一個標記）
        try{ if(new URLSearchParams(location.search).get('iam') === 'owner') localStorage.setItem('arp_owner','1'); }catch(e){}
        sendCollPv();
        loadFromSheet(resolveSheetId(cfg));
      });
  }
  // 測試時可用 ?notautoload 跳過真正的網路請求，改由測試注入 mock 資料
  if(!/[?&]notautoload/.test(location.search)) initCollection();
</script>
</body>
</html>
