<style>
  :root{
    --bg:#1a1616; --surface:#241f1f; --gold:#f2d98c; --teal:#6fb3b6;

  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans TC',system-ui,sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:28px 18px 18px; border-bottom:1px solid var(--line);
    text-align:center; background:linear-gradient(180deg,#221c1c,var(--bg));
  }
  .arplogo{
    display:block; margin:0 auto 12px; height:72px; max-width:76%;
    object-fit:contain;
  }
  @media(max-width:560px){ .arplogo{height:56px;} }
  h1{

  .meta{color:var(--muted); font-size:13px;}
  .searchwrap{max-width:1100px; margin:16px auto 0; padding:0 18px;}
  #search{
    width:100%; padding:11px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    font-size:15px; font-family:inherit;
  }
  #search::placeholder{color:var(--muted);}
  #search:focus{outline:none; border-color:var(--teal);}

  .filterbar label{color:var(--muted); font-size:12.5px; white-space:nowrap;}
  .filterbar select, .filterbar input.pricein{
    background:var(--surface); color:var(--text); border:1px solid var(--line);

  .filterbar select:focus, .filterbar input.pricein:focus{outline:none; border-color:var(--teal);}

  .seldisc{color:var(--brand);}
  .selpay{color:var(--gold);font-weight:700;}
  .selgoal{color:var(--teal);}
  .selnp{color:var(--muted);}
  .pill.nopromo{background:#ffffff08;color:var(--muted);border-color:var(--line);}

  .filterbar label.salechk{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:999px; padding:5px 12px; font-size:12.5px;
  }
  .filterbar label.salechk.on{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600;}
  .filterbar .dash{color:var(--muted);}
  #clearFilters{background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer;}
  #clearFilters:hover{border-color:var(--gold); color:var(--gold);}
  #resultCount{color:var(--muted); font-size:12.5px; margin-left:auto;}
  @media(max-width:560px){ #resultCount{margin-left:0; width:100%;} .filterbar input.pricein{width:64px;} }
  .fb-btn{position:fixed; right:16px; bottom:16px; z-index:900; background:var(--brand); color:#fff;
    border:none; border-radius:22px; padding:10px 18px; font-size:13.5px; font-family:inherit;
    cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .fb-btn:hover{filter:brightness(1.1);}
  .fb-mask{position:fixed; inset:0; background:rgba(8,6,6,.72); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .fb-box{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px; width:100%; max-width:420px;}
  .fb-box h3{margin:0 0 4px; font-size:17px; color:var(--gold); font-weight:500;}
  .fb-box p.fb-sub{margin:0 0 12px; font-size:12.5px; color:var(--muted);}
  .fb-box label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px;}
  .fb-box select, .fb-box input, .fb-box textarea{width:100%; background:#14100f; color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit;}
  .fb-box textarea{min-height:96px; resize:vertical;}
  .fb-box select:focus, .fb-box input:focus, .fb-box textarea:focus{outline:none; border-color:var(--teal);}
  .fb-hp{position:absolute; left:-9999px; width:1px; height:1px;}
  .fb-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:14px;}
  .fb-actions button{border-radius:8px; padding:9px 16px; font-size:13.5px; font-family:inherit; cursor:pointer;}
  .fb-cancel{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .fb-send{background:var(--brand); border:1px solid var(--brand); color:#fff;}
  .fb-send:disabled{opacity:.55; cursor:default;}
  .fb-hint{margin-top:10px; font-size:12.5px; min-height:17px;}
  main{max-width:1100px; margin:0 auto; padding:18px 18px 116px;}
  .grid{
    display:grid; gap:14px;
    grid-template-columns:repeat(2,1fr);
  }
  @media(min-width:620px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .photo{
    position:relative; width:100%; aspect-ratio:1/1; background:#0e0f14;
    display:flex; align-items:center; justify-content:center;
  }
  .photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo .ph{color:var(--muted); font-size:13px; letter-spacing:1px;}

  .body{padding:11px 12px 13px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .name{font-weight:700; font-size:14.5px; line-height:1.35;}
  .price{
    font-family:'Bebas Neue',sans-serif; letter-spacing:1px; color:var(--gold); font-size:23px;
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  /* 特價：原價劃線暗化，現價維持金色主體 */
  .oprice{color:var(--muted); font-size:16px; opacity:.7; text-decoration:line-through; text-decoration-thickness:1.5px;}
  .offtag{
    position:absolute; left:0; top:10px; z-index:2;
    background:var(--brand); color:#fff; font-size:11px; font-weight:700; letter-spacing:.5px;
    padding:3px 8px; border-radius:0 4px 4px 0; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  /* 無照片時退回價格列旁，避免標籤消失 */
  .offtag.inline{position:static; border-radius:4px; font-size:10px; padding:2px 6px; align-self:center;}
  .pills{display:flex; flex-wrap:wrap; gap:6px;}
  .pill{
    font-size:11.5px; padding:2px 9px; border-radius:999px;
    background:#6fb3b618; color:var(--teal); border:1px solid #6fb3b640;
  }
  .pill.side{background:#f2d98c18; color:var(--gold); border-color:#f2d98c40;}
  .pill.region{background:#93c97f18; color:#93c97f; border-color:#93c97f40;}
  .pill.sub{background:#ffffff10; color:var(--muted); border-color:var(--line);}
  .notes{color:var(--text); font-size:12px; line-height:1.5;}
  .promo{
    max-width:1100px; margin:16px auto 0; padding:12px 18px;
    background:#f2d98c16; border:1px solid #f2d98c45; border-radius:12px;
    color:var(--gold); font-size:14.5px; line-height:1.7;
    white-space:pre-wrap; text-align:center;
  }
  .intro{
    max-width:1100px; margin:18px auto 2px; padding:0 20px;
    color:var(--teal); font-size:14px; line-height:1.8;
    white-space:pre-wrap; text-align:center;
  }
  .intro a{ color:var(--gold); text-decoration:underline; word-break:break-all; }
  .socials{ max-width:1100px; margin:12px auto 2px; padding:0 20px;
    display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap; }
  .socials a{ color:var(--text); display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:6px 15px 6px 7px;
    transition:color .15s, border-color .15s, transform .15s; }
  .socials a:hover{ color:var(--gold); border-color:var(--gold); transform:translateY(-2px); }
  .soc-icon{ width:24px; height:24px; border-radius:50%; object-fit:cover; display:block; flex-shrink:0; }
  .soc-label{ font-size:13.5px; line-height:1; }
  .pagebar{
    max-width:1100px; margin:14px auto 0; padding:0 18px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; color:var(--muted); font-size:13px;
  }
  .pagebar select{
    background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 8px; font-family:inherit; font-size:13px;
  }
  .pagenav{display:flex; align-items:center; gap:10px;}
  .pagenav button{
    background:transparent; border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:6px 12px; cursor:pointer; font-family:inherit; font-size:13px;
  }
  .pagenav button:disabled{opacity:.4; cursor:default;}
  .pagenav button:not(:disabled):hover{border-color:var(--teal); color:var(--teal);}
  .pagebar-bottom{margin-top:18px; justify-content:center;}
  .selbtn{
    margin-top:auto; width:100%; padding:8px 10px; border-radius:8px; cursor:pointer;
    border:1px solid var(--brand); background:var(--brand); color:#fff;
    font-family:inherit; font-size:13px; font-weight:500;
  }
  .selbtn:hover{filter:brightness(1.1);}
  .selbtn.on{background:var(--gold); border-color:var(--gold); color:#3a2c05;}
  .card.sel-on{border-color:var(--gold);}
  .card.reserved{filter:brightness(0.8);}
  .selbtn.reserved{
    border-color:var(--line); color:var(--muted); background:transparent;
    cursor:not-allowed; opacity:0.9;
  }
  .selbtn.reserved:hover{background:transparent;}
  #selbar{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#221c1c; border-top:1px solid var(--gold);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .selbar-inner{
    max-width:1100px; margin:0 auto; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; justify-content:space-between;
  }
  #selinfo{color:var(--gold); font-weight:500; font-size:14.5px;}
  .selbar-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .selbar-btns button{
    padding:8px 14px; border-radius:8px; cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:500; border:1px solid var(--line); color:var(--text); background:transparent;
  }
  #copyListBtn{background:var(--gold); border-color:var(--gold); color:#1a1305;}
  #shareBtn{border-color:var(--teal); color:var(--teal);}
  #selflash{flex-basis:100%; color:var(--teal); font-size:12.5px; opacity:0; transition:opacity .2s; text-align:center;}
  .empty{
    text-align:center; color:var(--muted); padding:60px 18px; font-size:15px;
  }
  footer{
    max-width:1100px; margin:0 auto; padding:22px 18px 40px;
    color:var(--muted); font-size:12.5px; line-height:1.8;
    border-top:1px solid var(--line); text-align:center;
  }
</style>
</head>

<script>
  var ITEMS = [];
  var VER = '0'; // 圖片版本（來自 catalog.generatedAt），發布後改變即讓瀏覽器抓新圖
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // 先跳脫全部文字（防 XSS），再把 http(s) 網址包成可點連結。只允許 http/https。
  function linkify(s){
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g, function(u){
      var trail = '', m = u.match(/[.,!?)\]}）】」』、，。]+$/);
      if(m){ trail = m[0]; u = u.slice(0, u.length - trail.length); }
      return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>' + trail;
    });
  }
  // 社群連結：自訂陣列 [{icon:dataURL, label, url}]。相容舊的 {facebook,...} 物件格式。
  function normalizeShopSocials(socials){
    if(Array.isArray(socials)){
      return socials.filter(function(x){ return x && typeof x === 'object'; })
        .map(function(x){ return { icon: typeof x.icon==='string'?x.icon:'', label: typeof x.label==='string'?x.label:'', url: typeof x.url==='string'?x.url:'' }; });
    }
    if(socials && typeof socials === 'object'){   // 舊格式
      var names = { facebook:'Facebook', instagram:'Instagram', threads:'Threads', line:'LINE', website:'網站' }, out = [];
      Object.keys(names).forEach(function(k){ if(socials[k]) out.push({ icon:'', label:names[k], url:String(socials[k]) }); });
      return out;
    }
    return [];
  }
  function renderSocials(socials){
    var el = document.getElementById('socials'); if(!el) return;
    var items = normalizeShopSocials(socials);
    var html = '';
    items.forEach(function(it){
      var url = (it.url || '').trim();
      if(!/^https?:\/\//i.test(url)) return;                         // 只接受 http(s) 網址（擋 javascript: 等）
      var label = (it.label || '').trim();
      var iconHtml = (typeof it.icon === 'string' && /^data:image\//i.test(it.icon))  // 只接受圖片 data URI
        ? '<img class="soc-icon" src="'+esc(it.icon)+'" alt="">' : '';
      var labelHtml = label ? '<span class="soc-label">'+esc(label)+'</span>' : '';
      if(!iconHtml && !labelHtml) return;
      html += '<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" title="'+esc(label||'連結')+'">'+iconHtml+labelHtml+'</a>';
    });
    if(!html){ el.style.display = 'none'; return; }
    el.innerHTML = html;   // href/圖片/文字皆已 esc、url 限 http(s)、icon 限 data:image → 安全
    el.style.display = 'flex';
  }
  function fmtName(a,b){ return [a,b].filter(Boolean).join(' - ') || '未命名'; }
  // Sort key: artist name, leading "The " ignored (The Beatles → Beatles → B).
  function sortKey(it){
    return String(it.artist||'').trim().replace(/^the\s+/i,'').toLocaleLowerCase();
  }
  // Artists starting with a Latin letter sort A–Z up front; everyone else
  // (中文/日文/其他) is grouped together after them, in a consistent order —
  // so English names are never buried between CJK names.
  function isLatinStart(it){
    return /^[a-z]/i.test(String(it.artist||'').trim().replace(/^the\s+/i,''));
  }
  function cmpArtist(a, b){
    var la = isLatinStart(a), lb = isLatinStart(b);
    if(la !== lb) return la ? -1 : 1;            // Latin bucket first
    return sortKey(a).localeCompare(sortKey(b), la ? 'en' : 'zh-Hant');
  }
  // 上架時間：id 由 genId()=Date.now().toString(36)+5碼亂數 產生，去掉末 5 碼即建立毫秒。
  function idTime(id){
    id = String(id||'');
    if(id.length <= 5) return 0;
    var n = parseInt(id.slice(0, id.length-5), 36);
    return isFinite(n) ? n : 0;
  }
  // 排序用建立時間：優先用 dateAdded（若有），否則回退 id 內嵌時間。
  function createdMs(it){
    if(it && it.dateAdded){ var t = Date.parse(it.dateAdded); if(!isNaN(t)) return t; }
    return idTime(it && it.id);
  }
  // 價格數字（無法解析→null，代表「面議」）
  function priceNum(it){
    if(it==null || it.price===''|| it.price==null) return null;
    var n = parseFloat(it.price); return isFinite(n) ? n : null;
  }
  // 特價折數（%）。全站唯一定義「特價是否成立」的地方，後台只是鏡像顯示。
  // 用 + 而非 parseFloat：parseFloat('1,200') 會得到 1、parseFloat('300元') 會得到 300，
  // 都會算出假折扣；+ 對這些值一律回 NaN。
  // 分子先做整數乘法：寫成 (1 - p/o)*100 會因浮點誤差把剛好 10% 算成 9.999…→捨去成 9%。
  // 無條件捨去而非四捨五入：寧可少寫一趴，不可誇大折數。
  function discountPct(it){
    if(!it) return 0;
    var p = +it.price, o = +it.origPrice;
    if(!(p > 0) || !(o > p)) return 0;
    return Math.floor(((o - p) * 100) / o);
  }
  function sortItems(list, mode){
    var arr = list.slice();
    if(mode==='new')  arr.sort(function(a,b){ return createdMs(b)-createdMs(a); });
    else if(mode==='old') arr.sort(function(a,b){ return createdMs(a)-createdMs(b); });
    else if(mode==='price-asc' || mode==='price-desc'){
      arr.sort(function(a,b){
        var pa=priceNum(a), pb=priceNum(b);
        if(pa==null && pb==null) return cmpArtist(a,b);
        if(pa==null) return 1;   // 面議排最後
        if(pb==null) return -1;
        return mode==='price-asc' ? pa-pb : pb-pa;
      });
    }
    else if(mode==='off-desc'){
      arr.sort(function(a,b){
        var da=discountPct(a), db=discountPct(b);
        if(da===db) return cmpArtist(a,b);
        return db-da;            // 無折扣＝0，自然墊底
      });
    }
    else arr.sort(cmpArtist);   // 'artist'
    return arr;
  }

  // 三軸標籤值（陣列）；舊 catalog 只有單一 it.genre 時，回退當作子曲風。
  function axisVals(it, key){
    var a = it[key];
    if(Array.isArray(a)) return a.filter(Boolean);
    if(key==='subgenres' && it.genre) return [it.genre];
    return [];
  }
  function cardHtml(it){
    var img;
    if(it.hasImage){
      // extension may be jpg or png; fall back once, then placeholder
      img = '<img loading="lazy" src="images/'+encodeURIComponent(it.id)+'.jpg?v='+VER+'" '
          + 'onerror="this.onerror=null;this.src=\'images/'+encodeURIComponent(it.id)+'.png?v='+VER+'\';'
          + 'this.setAttribute(\'data-fb\',\'1\');" '
          + 'onload="if(this.getAttribute(\'data-fb\')&&!this.naturalWidth){}" '
          + 'alt="'+esc(fmtName(it.artist,it.album))+'">';
    } else {
      img = '<span class="ph">無照片</span>';
    }
    var price = (it.price!=null && it.price!=='') ? 'NT$'+esc(it.price) : '面議';
    // 特價：一律輸出「解析後的數字」而非 it.origPrice 原字串——即使備份/同步匯入
    // 塞進奇怪的值，也不可能把原字串回吐到 HTML 裡。
    var off = discountPct(it);
    if(off >= 1) price = '<span class="oprice">NT$' + (+it.origPrice) + '</span>' + price;
    var offTag  = off >= 1 && it.hasImage  ? '<span class="offtag">'+off+'% OFF</span>' : '';
    var npPill = it.noPromo ? '<span class="pill nopromo">不參與優惠</span>' : '';
    var offPill = off >= 1 && !it.hasImage ? '<span class="offtag inline">'+off+'% OFF</span>' : '';
    var pills = '';
    if(it.sideLabel) pills += '<span class="pill side">附側標</span>';   // 附側標永遠排第一
    pills += npPill;
    axisVals(it,'regions').forEach(function(r){ pills += '<span class="pill region">'+esc(r)+'</span>'; });
    axisVals(it,'genres').forEach(function(g){ pills += '<span class="pill">'+esc(g)+'</span>'; });
    axisVals(it,'subgenres').forEach(function(s){ pills += '<span class="pill sub">'+esc(s)+'</span>'; });
    var notes = it.notes ? '<div class="notes">'+esc(it.notes)+'</div>' : '';
    var selBtn = it.reserved
      ? '<button class="selbtn reserved" disabled>保留中</button>'
      : '<button class="selbtn" data-id="'+esc(it.id)+'">加入選購</button>';
    return '<div class="card'+(it.reserved?' reserved':'')+'" data-id="'+esc(it.id)+'">'
      + '<div class="photo'+(it.hasImage?' wm-on':'')+'">'+offTag+img+'</div>'
      + '<div class="body">'
      + '<div class="name">'+esc(fmtName(it.artist,it.album))+'</div>'
      + '<div class="price">'+price+offPill+'</div>'
      + (pills ? '<div class="pills">'+pills+'</div>' : '')
      + notes
      + selBtn
      + '</div></div>';
  }

  // ---- 消費者選購清單（純前端，複製/分享，無後端） ----
  var SELECTED = {};
  var PROMO_RULES = [], SHIP_OPTIONS = [];
  function selectedItems(){
    return Object.keys(SELECTED).map(function(id){
      return ITEMS.filter(function(x){ return x.id===id; })[0];
    }).filter(Boolean);
  }
  // 用 + 而非 parseInt：parseInt('1,200') 會讀成 1、parseInt('1200元') 會讀成 1200，兩個都算出假金額。
  function itemPrice(it){ var v = +((it && it.price != null) ? it.price : ''); return (isFinite(v) && v > 0) ? v : 0; }
  function subtotal(){ var t=0; selectedItems().forEach(function(it){ t += itemPrice(it); }); return t; }
  // 有標價的才算進門檻；面議商品不知道多少錢，計進去會算出「3 件應付 NT$0」這種東西。
  // 符合優惠資格＝有標價、且沒有被標記「不參與優惠」（殘次／已特價品）
  function promoOk(it){ return itemPrice(it) > 0 && !(it && it.noPromo); }
  function pricedCount(){ var n=0; selectedItems().forEach(function(it){ if(promoOk(it)) n++; }); return n; }
  function promoSubtotal(){ var t=0; selectedItems().forEach(function(it){ if(promoOk(it)) t += itemPrice(it); }); return t; }
  function noPromoCount(){ var n=0; selectedItems().forEach(function(it){ if(itemPrice(it)>0 && it && it.noPromo) n++; }); return n; }

  // **與 renderer/index.html 的 computePromo 必須完全同規則**，改一邊要改兩邊。
  // 前台不算運費（賣家不在網頁上收錢），所以 shipFee 一律傳 0；免運只在後台成立訂單時折抵。
  function computePromo(qty, sub, rules, shipFee, fullSub){
    var q = +qty || 0, s2 = +sub || 0, fee = +shipFee || 0;
    var total = (fullSub == null) ? s2 : (+fullSub || 0);
    var out = { discount: 0, freeShip: false, lines: [] };
    (rules && rules.length ? rules : []).forEach(function(r){
      if(!r || r.on === false) return;
      var n = +r.n;
      if(!isFinite(n) || n <= 0) return;
      var base = (r.metric === 'qty') ? q : (r.kind === 'freeship' ? total : s2);
      var times = (r.mode === 'every' && r.kind === 'amount') ? Math.floor(base / n) : (base >= n ? 1 : 0);
      if(times <= 0) return;
      var amt = 0;
      if(r.kind === 'amount'){ amt = (+r.value || 0) * times; }
      else if(r.kind === 'percent'){
        var x = +r.value || 0;
        if(x <= 0 || x >= 10) return;
        amt = Math.round(s2 * (10 - x) / 10);
      } else if(r.kind === 'freeship'){
        if(out.freeShip) return;
        amt = fee; out.freeShip = true;
      }
      if(amt <= 0 && r.kind !== 'freeship') return;
      out.discount += amt;
      out.lines.push({ name: String(r.name || '優惠'), amount: amt, times: times, kind: r.kind });
    });
    out.discount = Math.max(0, Math.min(out.discount, total));
    return out;
  }
  // 「再買 ◯ 件可折 ◯ / 再買 ◯ 元免運」——只看還沒達成的規則，取最接近的那一條
  function nextGoal(qty, sub, rules){
    var best = null;
    (rules && rules.length ? rules : []).forEach(function(r){
      if(!r || r.on === false) return;
      var n = +r.n; if(!isFinite(n) || n <= 0) return;
      var base = (r.metric === 'qty') ? qty : sub;
      var target = (r.mode === 'every') ? (Math.floor(base / n) + 1) * n : n;
      if(base >= target) return;
      var gap = target - base;
      if(!best || gap < best.gap) best = { gap: gap, metric: r.metric, kind: r.kind, value: +r.value || 0, name: String(r.name || '') };
    });
    if(!best) return '';
    var unit = (best.metric === 'qty') ? '件' : '元';
    var what = (best.kind === 'freeship') ? '免運'
             : (best.kind === 'percent') ? ('打 ' + best.value + ' 折')
             : ('折 NT$' + best.value);
    return '再買 ' + best.gap + unit + ' 就' + what;
  }

  function buildList(){
    var its = selectedItems();
    var sub = subtotal();
    var r = computePromo(pricedCount(), promoSubtotal(), PROMO_RULES, 0, sub);
    var lines = its.map(function(it,i){
      return (i+1)+'. '+fmtName(it.artist,it.album)+'　'+((it.price!=null&&it.price!=='')?('NT$'+itemPrice(it)):'面議');
    });
    var out = '【CD 選購清單】\n\n'+lines.join('\n')+'\n\n共 '+its.length+' 件，價格小計 NT$'+sub;
    r.lines.forEach(function(l){
      if(l.kind === 'freeship') out += '\n'+l.name+'：免運';
      else out += '\n'+l.name+(l.times>1?('×'+l.times):'')+'：−NT$'+l.amount;
    });
    var npc2 = noPromoCount();
    if(npc2 > 0) out += '\n（其中 '+npc2+' 件不參與優惠）';
    if(r.discount > 0) out += '\n應付 NT$'+(sub - r.discount);
    var shipSel = document.getElementById('shipSel');
    if(shipSel && shipSel.value) out += '\n\n希望的運送方式：'+shipSel.value;
    return out + '\n（我在你的商品頁挑了這些，想跟你購買！）';
  }
  // 運送方式下拉：只是讓客人告訴賣家想怎麼寄，不參與任何金額計算。
  // 一律 createElement + textContent —— 名稱是後台自訂字串，innerHTML 會變成注入點。
  function initShipSel(){
    var wrap = document.getElementById('shipWrap');
    var sel = document.getElementById('shipSel');
    if(!wrap || !sel) return;
    sel.innerHTML = '';
    if(!SHIP_OPTIONS.length){ wrap.style.display = 'none'; return; }
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = '（未指定）';
    sel.appendChild(blank);
    SHIP_OPTIONS.forEach(function(m){
      if(!m || !m.name) return;
      var o = document.createElement('option');
      o.value = String(m.name); o.textContent = String(m.name);
      sel.appendChild(o);
    });
    try{ var saved = localStorage.getItem('arp_ship'); if(saved) sel.value = saved; }catch(e){}
    sel.addEventListener('change', function(){
      try{ localStorage.setItem('arp_ship', sel.value); }catch(e){}
    });
    wrap.style.display = 'inline-flex';
  }
  function updateBar(){
    var n = Object.keys(SELECTED).length;
    var bar = document.getElementById('selbar');
    if(!n){ bar.style.display='none'; return; }
    var sub = subtotal();
    var r = computePromo(pricedCount(), promoSubtotal(), PROMO_RULES, 0, sub);
    // 全部用 textContent 逐段組——規則名稱是自訂字串，用 innerHTML 會變成公開站的注入點
    var info = document.getElementById('selinfo');
    info.textContent = '';
    var head = document.createElement('span');
    head.textContent = '已選 '+n+' 件 · 小計 NT$'+sub;
    info.appendChild(head);
    r.lines.forEach(function(l){
      var e = document.createElement('span');
      e.className = 'seldisc';
      e.textContent = ' · ' + l.name + (l.times>1?('×'+l.times):'') + (l.kind==='freeship' ? '：免運' : ' −NT$'+l.amount);
      info.appendChild(e);
    });
    if(r.discount > 0){
      var pay = document.createElement('span');
      pay.className = 'selpay';
      pay.textContent = ' · 應付 NT$' + (sub - r.discount);
      info.appendChild(pay);
    }
    var npc = noPromoCount();
    if(npc > 0){
      var np = document.createElement('span');
      np.className = 'selnp';
      np.textContent = ' · ' + npc + ' 件不參與優惠';
      info.appendChild(np);
    }
    var goal = nextGoal(pricedCount(), promoSubtotal(), PROMO_RULES);
    if(goal){
      var g = document.createElement('span');
      g.className = 'selgoal'; g.textContent = ' · ' + goal;
      info.appendChild(g);
    }
    bar.style.display='block';
  }
  function syncCards(){
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function(card){
      var b = card.querySelector('.selbtn');
      if(!b || b.classList.contains('reserved')) return; // 保留中按鈕不動
      var on = !!SELECTED[card.getAttribute('data-id')];
      card.classList.toggle('sel-on', on);
      b.classList.toggle('on', on);
      b.textContent = on ? '✓ 已選購（再按取消）' : '加入選購';
    });
  }
  function toggleSel(id){
    if(SELECTED[id]) delete SELECTED[id]; else SELECTED[id]=true;
    syncCards(); updateBar();
  }
  function fallbackCopy(t){
    var ta=document.createElement('textarea'); ta.value=t;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
  function copyText(t){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(t); });
        return;
      }
    }catch(e){}
    fallbackCopy(t);
  }
  function flash(msg){
    var el=document.getElementById('selflash'); el.textContent=msg; el.style.opacity='1';
    clearTimeout(el._t); el._t=setTimeout(function(){ el.style.opacity='0'; }, 2800);
  }
  function initSelUI(){
    document.getElementById('grid').addEventListener('click', function(e){
      var b = e.target && e.target.closest ? e.target.closest('.selbtn') : null;
      if(b && !b.disabled && !b.classList.contains('reserved') && b.getAttribute('data-id')){
        toggleSel(b.getAttribute('data-id'));
      }
    });
    document.getElementById('copyListBtn').addEventListener('click', function(){
      if(!Object.keys(SELECTED).length){ flash('請先勾選商品'); return; }
      copyText(buildList()); flash('已複製清單！貼到私訊傳給賣家即可');
    });
    document.getElementById('clearSelBtn').addEventListener('click', function(){
      SELECTED={}; syncCards(); updateBar();
    });
    var sb=document.getElementById('shareBtn');
    if(navigator.share){
      sb.addEventListener('click', function(){
        if(!Object.keys(SELECTED).length){ flash('請先勾選商品'); return; }
        navigator.share({ title:'CD 選購清單', text:buildList() }).catch(function(){});
      });
    } else { sb.style.display='none'; }
  }

  function render(list){
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    if(!list.length){ grid.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    grid.innerHTML = list.map(cardHtml).join('');
    syncCards();
  }

  // ---- 分頁 ----
  var CURRENT = [];   // 目前（篩選後）清單
  var PAGE = 1;
  var PAGE_SIZE = 16;
  try { var _sp = parseInt(localStorage.getItem('cdshop_pagesize'),10); if([16,64,128].indexOf(_sp)!==-1) PAGE_SIZE = _sp; } catch(e){}

  function totalPages(){ return Math.max(1, Math.ceil(CURRENT.length / PAGE_SIZE)); }
  function renderPage(){
    var tp = totalPages();
    if(PAGE > tp) PAGE = tp; if(PAGE < 1) PAGE = 1;
    var start = (PAGE-1)*PAGE_SIZE;
    render(CURRENT.slice(start, start + PAGE_SIZE));
    var from = CURRENT.length ? start+1 : 0;
    var to = Math.min(start + PAGE_SIZE, CURRENT.length);
    var info = CURRENT.length ? ('第 '+PAGE+' / '+tp+' 頁（顯示 '+from+'–'+to+'，共 '+CURRENT.length+' 件）') : '共 0 件';
    document.getElementById('pageInfoTop').textContent = info;
    document.getElementById('pageInfoBot').textContent = info;
    var atFirst = PAGE<=1, atLast = PAGE>=tp;
    document.getElementById('prevTop').disabled = atFirst;
    document.getElementById('prevBot').disabled = atFirst;
    document.getElementById('nextTop').disabled = atLast;
    document.getElementById('nextBot').disabled = atLast;
    document.getElementById('pagebarBottom').style.display = (tp>1) ? 'flex' : 'none';
  }
  function setList(list){ CURRENT = list; PAGE = 1; renderPage(); }
  function gotoPage(p){ PAGE = p; renderPage(); window.scrollTo({top:0, behavior:'smooth'}); }
  function initPaging(){
    var sel = document.getElementById('pageSize');
    sel.value = String(PAGE_SIZE);
    sel.addEventListener('change', function(){
      PAGE_SIZE = parseInt(sel.value,10) || 16;
      try{ localStorage.setItem('cdshop_pagesize', String(PAGE_SIZE)); }catch(e){}
      PAGE = 1; renderPage();
    });
    document.getElementById('prevTop').addEventListener('click', function(){ gotoPage(PAGE-1); });
    document.getElementById('nextTop').addEventListener('click', function(){ gotoPage(PAGE+1); });
    document.getElementById('prevBot').addEventListener('click', function(){ gotoPage(PAGE-1); });
    document.getElementById('nextBot').addEventListener('click', function(){ gotoPage(PAGE+1); });
  }

  function applyFilter(){
    var raw = document.getElementById('search').value.trim();
    var q = raw.toLowerCase();
    trackSearch(raw);
    var region = document.getElementById('regionSel').value;
    var genre = document.getElementById('genreSel').value;
    var sub = document.getElementById('subSel').value;
    var sortMode = document.getElementById('sortSel').value;
    var minV = parseFloat(document.getElementById('priceMin').value);
    var maxV = parseFloat(document.getElementById('priceMax').value);
    var hasMin = isFinite(minV), hasMax = isFinite(maxV);
    var priceActive = hasMin || hasMax;
    var saleOnly = document.getElementById('saleOnly').checked;
    document.getElementById('saleChk').classList.toggle('on', saleOnly);

    var out = ITEMS.filter(function(it){
      if(saleOnly && discountPct(it) < 1) return false;
      if(q && ((it.artist||'')+' '+(it.album||'')).toLowerCase().indexOf(q) === -1) return false;
      if(region && axisVals(it,'regions').indexOf(region) === -1) return false;
      if(genre && axisVals(it,'genres').indexOf(genre) === -1) return false;
      if(sub && axisVals(it,'subgenres').indexOf(sub) === -1) return false;
      if(priceActive){
        var p = priceNum(it);
        if(p==null) return false;               // 有價格範圍時，面議商品不納入
        if(hasMin && p < minV) return false;
        if(hasMax && p > maxV) return false;
      }
      return true;
    });
    out = sortItems(out, sortMode);
    setList(out);

    // 結果數與「清除篩選」顯示
    var filtering = !!q || !!region || !!genre || !!sub || priceActive || saleOnly;
    document.getElementById('clearFilters').style.display = filtering ? 'inline-block' : 'none';
    var rc = document.getElementById('resultCount');
    rc.textContent = filtering ? ('符合 ' + out.length + ' 件 / 共 ' + ITEMS.length + ' 件') : '';
  }
  function clearFilters(){
    document.getElementById('search').value = '';
    document.getElementById('regionSel').value = '';
    document.getElementById('genreSel').value = '';
    document.getElementById('subSel').value = '';
    document.getElementById('priceMin').value = '';
    document.getElementById('priceMax').value = '';
    document.getElementById('saleOnly').checked = false;
    applyFilter();
  }
  // 從商品清單建立三軸下拉選項；某軸完全沒有值時整組隱藏。
  function fillAxis(selId, groupId, key){
    var set = {}, list = [];
    ITEMS.forEach(function(it){ axisVals(it,key).forEach(function(v){ v=(v||'').trim(); if(v && !set[v]){ set[v]=1; list.push(v); } }); });
    list.sort(function(a,b){ return a.localeCompare(b, 'zh-Hant'); });
    var sel = document.getElementById(selId);
    list.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
    document.getElementById(groupId).style.display = list.length ? '' : 'none';
  }
  function populateGenres(){
    fillAxis('regionSel', 'regionGroup', 'regions');
    fillAxis('genreSel',  'genreGroup',  'genres');
    fillAxis('subSel',    'subGroup',    'subgenres');
  }

  // ---- 訪客追蹤（送到你的 Google Apps Script；排除你自己；無 cookie）----
  var TRACK_URL = '';
  function deriveSource(ref, params){
    var utm = params.get('utm_source') || params.get('from');
    if(utm) return utm;
    var host='';
    try{ host = ref ? new URL(ref).hostname.replace(/^www\./,'') : ''; }catch(e){}
    if(!host) return '直接進入';
    if(/facebook|fb\.com|fb\.me/.test(host)) return 'Facebook';
    if(/threads\.net/.test(host)) return 'Threads';
    if(/instagram/.test(host)) return 'Instagram';
    if(/t\.co|twitter|x\.com/.test(host)) return 'Twitter/X';
    if(/tinyurl/.test(host)) return 'TinyURL';
    if(/google/.test(host)) return 'Google';
    if(/line\./.test(host)) return 'LINE';
    return host;
  }
  function isOwner(){ try{ return localStorage.getItem('arp_owner')==='1'; }catch(e){ return false; } }
  function sendEvent(payload){
    if(!TRACK_URL || isOwner()) return;
    try{
      var body = JSON.stringify(payload);
      if(navigator.sendBeacon){ navigator.sendBeacon(TRACK_URL, new Blob([body],{type:'text/plain'})); }
      else { fetch(TRACK_URL,{method:'POST',mode:'no-cors',keepalive:true,body:body}); }
    }catch(e){}
  }
  var _lastSearch='', _searchTimer=null, _pendingSearch='';
  // 只在「停止輸入一段時間」或明確送出（按 Enter／離開搜尋框／關閉頁面）時才記一筆，
  // 避免把打字過程的每個前綴（p, pi, pin, pink）都記成獨立搜尋紀錄。
  function trackSearch(term){
    _pendingSearch = (term||'').trim();
    if(!TRACK_URL || isOwner()) return;
    clearTimeout(_searchTimer);
    if(!_pendingSearch) return;
    _searchTimer = setTimeout(commitSearch, 3500);   // 停止輸入 3.5 秒才記
  }
  function commitSearch(){
    clearTimeout(_searchTimer);
    var term = (_pendingSearch||'').trim();
    if(!TRACK_URL || isOwner() || !term || term===_lastSearch) return;
    _lastSearch = term;
    sendEvent({ ev:'search', t:new Date().toISOString(), q:term,
      src:deriveSource(document.referrer, new URLSearchParams(location.search)),
      ua:navigator.userAgent||'' });
  }
  // ---- 意見回饋（送到同一支 Apps Script，type:'feedback' → 寫 feedback 工作表）----
  function fbTrackUrl(){ return (typeof FB_TRACK === 'string' && FB_TRACK) ? FB_TRACK : ''; }
  function fbInit(){
    var btn = document.getElementById('fbBtn'); if(!btn) return;
    if(!fbTrackUrl()) return;                    // 沒設追蹤網址就不顯示按鈕
    btn.style.display = '';
    var mask = document.getElementById('fbMask');
    var hint = document.getElementById('fbHint');
    var open = function(){ mask.style.display = 'flex'; hint.textContent = ''; document.getElementById('fbMsg').focus(); };
    var close = function(){ mask.style.display = 'none'; };
    btn.addEventListener('click', open);
    document.getElementById('fbCancel').addEventListener('click', close);
    mask.addEventListener('click', function(e){ if(e.target === mask) close(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && mask.style.display !== 'none') close(); });
    document.getElementById('fbSend').addEventListener('click', function(){
      var send = this;
      var msg = (document.getElementById('fbMsg').value || '').trim();
      if(!msg){ hint.style.color = 'var(--brand)'; hint.textContent = '請先填寫留言'; return; }
      if((document.getElementById('fbHp').value || '').trim()){ close(); return; }   // 蜜罐：機器人填了就靜默丟棄
      var last = 0; try{ last = parseInt(localStorage.getItem('arp_fb_last') || '0', 10) || 0; }catch(e){}
      if(Date.now() - last < 60000){ hint.style.color = 'var(--brand)'; hint.textContent = '剛剛已送出過，請稍候再試'; return; }
      var body = JSON.stringify({
        type:'feedback', t:new Date().toISOString(),
        kind: document.getElementById('fbKind').value,
        message: msg,
        contact: (document.getElementById('fbContact').value || '').trim(),
        page: location.pathname, ua: navigator.userAgent || ''
      });
      try{
        if(navigator.sendBeacon){ navigator.sendBeacon(fbTrackUrl(), new Blob([body],{type:'text/plain'})); }
        else { fetch(fbTrackUrl(), {method:'POST', mode:'no-cors', keepalive:true, body:body}); }
      }catch(e){}
      try{ localStorage.setItem('arp_fb_last', String(Date.now())); }catch(e){}
      send.disabled = true;
      hint.style.color = 'var(--teal)'; hint.textContent = '已送出，謝謝你的回饋！';
      document.getElementById('fbMsg').value = ''; document.getElementById('fbContact').value = '';
      setTimeout(function(){ close(); send.disabled = false; }, 1400);
    });
  }
  var FB_TRACK = '';
  function initTracking(url){
    TRACK_URL = url || '';
    FB_TRACK = TRACK_URL; fbInit();
    var params = new URLSearchParams(location.search);
    if(params.get('iam')==='owner'){
      try{ localStorage.setItem('arp_owner','1'); }catch(e){}
      var on=document.getElementById('ownerNote'); if(on) on.style.display='block';
    }
    if(!TRACK_URL || isOwner()) return;
    sendEvent({
      ev:'pv', t:new Date().toISOString(), ref:document.referrer||'',
      src:deriveSource(document.referrer, params),
      path:location.pathname, q:(params.get('q')||''),
      scr:(screen.width+'x'+screen.height), lang:navigator.language||'', ua:navigator.userAgent||''
    });
  }

  fetch('./catalog.json?_=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(data){
    ITEMS = (data && Array.isArray(data.items)) ? data.items : [];
    VER = encodeURIComponent(String((data && data.generatedAt) || Date.now()).replace(/[^0-9A-Za-z]/g,''));
    if(data && data.intro && String(data.intro).trim()){
      var introEl = document.getElementById('intro');
      introEl.innerHTML = linkify(data.intro);   // 網址自動變連結（文字已跳脫，安全）
      introEl.style.display = 'block';
    }
    // 舊 catalog 沒有這兩個欄位——一定要保底，否則 .forEach 會 throw 把整頁弄掛
    PROMO_RULES  = (data && Array.isArray(data.promoRules))  ? data.promoRules  : [];
    SHIP_OPTIONS = (data && Array.isArray(data.shipOptions)) ? data.shipOptions : [];
    initShipSel();
    renderSocials(data && data.socials);   // 社群圖示列
    if(data && data.promo && String(data.promo).trim()){
      var promoEl = document.getElementById('promo');
      promoEl.textContent = data.promo;
      promoEl.style.display = 'block';
    }
    var upd = document.getElementById('updated');
    if(data && data.generatedAt){
      try{ upd.textContent = '更新於 ' + new Date(data.generatedAt).toLocaleString('zh-TW') + '　'; }
      catch(e){ upd.textContent=''; }
    }
    document.getElementById('countMeta').textContent = '共 ' + ITEMS.length + ' 件';
    initPaging();
    populateGenres();
    applyFilter();               // 依預設排序（最新上架）建立首頁清單
    initSelUI();
    initTracking(data && data.trackUrl);
    var searchEl = document.getElementById('search');
    searchEl.addEventListener('input', applyFilter);
    // 明確送出訊號：按 Enter、離開搜尋框、或關閉/切走頁面時，把當下的搜尋詞記一筆
    searchEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') commitSearch(); });
    searchEl.addEventListener('blur', commitSearch);
    window.addEventListener('pagehide', commitSearch);
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') commitSearch(); });
    document.getElementById('sortSel').addEventListener('change', applyFilter);
    document.getElementById('regionSel').addEventListener('change', applyFilter);
    document.getElementById('genreSel').addEventListener('change', applyFilter);
    document.getElementById('subSel').addEventListener('change', applyFilter);
    document.getElementById('priceMin').addEventListener('input', applyFilter);
    document.getElementById('priceMax').addEventListener('input', applyFilter);
    document.getElementById('saleOnly').addEventListener('change', applyFilter);
    document.getElementById('clearFilters').addEventListener('click', clearFilters);
  }).catch(function(){
    document.getElementById('empty').style.display='block';
    document.getElementById('empty').textContent = '無法載入目錄';
  });
</script>
</body>
</html>
